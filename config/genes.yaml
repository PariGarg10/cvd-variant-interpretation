# Cardiovascular gene panel for this project.
# Panel is modeled on genes commonly used in inherited cardiac condition
# classifiers (e.g. CardioBoost-style disease-specific panels), combining
# cardiomyopathy and arrhythmia syndrome genes. Trim or extend this list
# as your dataset size / compute budget requires.

cardiomyopathy_genes:
